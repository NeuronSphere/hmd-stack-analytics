# Build and publish this stack. Generated by `nsctl stack init` (NERD019).
#
# verify  -- every pull request: validate, build the OCI image layout, keep it.
# release -- pushes to the default branch: publish with the next version.
#
# Pins are bumped by hand -- see meta-data/manifest.json / neuronsphere.lock --
# rather than by an automatic weekly refresh.
#
# The first release creates a PRIVATE package on ghcr.io. Make it public once,
# by hand, in the package's settings -- GitHub has no API for that -- so that
# `nsctl stack add` works for anyone with no token.
name: stack

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

env:
  STACK_REF: ghcr.io/neuronsphere/stacks/analytics

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: neuronsphere/hmd-cli-neuronsphere/.github/actions/setup-nsctl@main
      # What `hmd login service` does, without installing the Python CLI: a
      # client-credentials grant from the service client. `nsctl stack build`
      # and `nsctl lock --resolve` fetch the pinned zips from the Artifact
      # Librarian with it. The four secrets must be set on this repository;
      # a pull request from a fork does not see them and cannot build.
      - name: Librarian service token
        env:
          HMD_SERVICES_ISSUER: ${{ secrets.HMD_SERVICES_ISSUER }}
          HMD_SERVICE_CLIENT_ID: ${{ secrets.HMD_SERVICE_CLIENT_ID }}
          HMD_SERVICE_CLIENT_SECRET: ${{ secrets.HMD_SERVICE_CLIENT_SECRET }}
          HMD_ARTIFACT_LIBRARIAN_URL: ${{ secrets.HMD_ARTIFACT_LIBRARIAN_URL }}
        run: |
          for v in HMD_SERVICES_ISSUER HMD_SERVICE_CLIENT_ID HMD_SERVICE_CLIENT_SECRET HMD_ARTIFACT_LIBRARIAN_URL; do
            [ -n "${!v}" ] || { echo "::error::secret $v is not set"; exit 1; }
          done
          token=$(curl -fsS -X POST "${HMD_SERVICES_ISSUER%/}/v1/token" \
            -d grant_type=client_credentials -d scope=service \
            -d "client_id=$HMD_SERVICE_CLIENT_ID" -d "client_secret=$HMD_SERVICE_CLIENT_SECRET" \
            | jq -r '.access_token // empty')
          [ -n "$token" ] || { echo "::error::the issuer returned no access_token"; exit 1; }
          echo "::add-mask::$token"
          echo "HMD_AUTH_TOKEN=$token" >> "$GITHUB_ENV"
          echo "HMD_ARTIFACT_LIBRARIAN_URL=$HMD_ARTIFACT_LIBRARIAN_URL" >> "$GITHUB_ENV"
      - run: nsctl repoclass validate
      - run: nsctl stack build
      - uses: actions/upload-artifact@v4
        with:
          name: stack-layout
          path: build/stack

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: neuronsphere/hmd-cli-neuronsphere/.github/actions/setup-nsctl@main
      # What `hmd login service` does, without installing the Python CLI: a
      # client-credentials grant from the service client. `nsctl stack build`
      # and `nsctl lock --resolve` fetch the pinned zips from the Artifact
      # Librarian with it. The four secrets must be set on this repository;
      # a pull request from a fork does not see them and cannot build.
      - name: Librarian service token
        env:
          HMD_SERVICES_ISSUER: ${{ secrets.HMD_SERVICES_ISSUER }}
          HMD_SERVICE_CLIENT_ID: ${{ secrets.HMD_SERVICE_CLIENT_ID }}
          HMD_SERVICE_CLIENT_SECRET: ${{ secrets.HMD_SERVICE_CLIENT_SECRET }}
          HMD_ARTIFACT_LIBRARIAN_URL: ${{ secrets.HMD_ARTIFACT_LIBRARIAN_URL }}
        run: |
          for v in HMD_SERVICES_ISSUER HMD_SERVICE_CLIENT_ID HMD_SERVICE_CLIENT_SECRET HMD_ARTIFACT_LIBRARIAN_URL; do
            [ -n "${!v}" ] || { echo "::error::secret $v is not set"; exit 1; }
          done
          token=$(curl -fsS -X POST "${HMD_SERVICES_ISSUER%/}/v1/token" \
            -d grant_type=client_credentials -d scope=service \
            -d "client_id=$HMD_SERVICE_CLIENT_ID" -d "client_secret=$HMD_SERVICE_CLIENT_SECRET" \
            | jq -r '.access_token // empty')
          [ -n "$token" ] || { echo "::error::the issuer returned no access_token"; exit 1; }
          echo "::add-mask::$token"
          echo "HMD_AUTH_TOKEN=$token" >> "$GITHUB_ENV"
          echo "HMD_ARTIFACT_LIBRARIAN_URL=$HMD_ARTIFACT_LIBRARIAN_URL" >> "$GITHUB_ENV"
      - run: nsctl stack build
      - run: nsctl stack push "$STACK_REF" --from build/stack --bump
        env:
          HMD_REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HMD_REGISTRY_USER: ${{ github.actor }}
